# ===================================================================
# ictara - port yapilandirmasi  (conf/ports.conf)
# -------------------------------------------------------------------
# Bu dosya ictara tarafindan `source` edilir -> gecerli bir bash
# dosyasi olmali (sadece degisken atamalari). Moduller port->modul
# eslemesini ve varsayilan portlari buradan okur.
# ===================================================================

# --- FAZ 2'ye ZORLA dahil edilecek nis portlar ---------------------
# nmap --top-ports 1000 icinde OLMAYABILECEK ama ic agda kritik olan
# portlar. FAZ 2 bunlari ayri bir taramayla haritaya ekler.
#   5480/5988/5989 VMware (VCSA / CIM)   902/903 ESXi
#   9042 Cassandra   11211 Memcached     9200/9300 Elasticsearch
#   5984 CouchDB     50000 DB2           3050 Firebird
#   8086 InfluxDB    8000/8182 muhtelif  9080 WebSphere
NIS_PORTLAR="5480 5988 5989 902 903 9042 11211 9200 9300 5984 50000 3050 8086 8000 8182 9080"

# --- Port -> Modul eslemesi (TETIKLEYICI portlar) ------------------
# Bir modul, port haritasinda ASAGIDAKI portlardan EN AZ BIRI acik
# olan host'lara gider. (hosts_with_ports bu listeyi kullanir.)
# Not: step_snmp (161/udp) ve step_os port haritasindan BAGIMSIZDIR
#      (acikca asagida da tanimli ama modul mantigi onlari ozel isler).
TRIG_smb="445 139"
TRIG_shares="445"
TRIG_snmp="161"
TRIG_cleartext="21 23 69 512 513 514 5900 5901"
TRIG_db="1433 1521 3306 5432 27017 27018 6379 11211 9200 9300 5984 9042 50000 3050 8086"
TRIG_vmware="443 902 903 5480 5988 5989"
TRIG_vuln="445 3389 139"
TRIG_os="445 139"

# --- Modul -> VARSAYILAN tarama portu (-p) -------------------------
# Dogrudan hedefli mod (--only) `-p` vermezse bu portlar kullanilir.
# (Bunlar nmap'e verilen -p listesidir; tetikleyici portlardan farkli
#  olabilir, orn. cleartext http-auth icin 80/8080/8443 de tarar.)
DEF_smb="139,445"
DEF_shares="445"
DEF_snmp="161"
DEF_cleartext="21,23,69,512,513,514,5900,5901,8080,80,8443"
DEF_db="1433,1521,3306,5432,27017,27018,6379,11211,9200,9300,5984,9042,50000,3050,8086"
DEF_mssql="1433"
DEF_vmware="443,902,903,5480,5988,5989"
DEF_vuln="139,445,3389"
DEF_os="139,445"
